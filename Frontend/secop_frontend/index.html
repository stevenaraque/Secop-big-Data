<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- P0-5: CSP fallback si nginx no inyecta headers (Vercel). Mitiga XSS con JWT en localStorage. Plan: migrar a cookies HttpOnly. -->
    <!-- connect-src incluye prod (Render backend + Vercel front). object-src/base-uri cierran inyección de plugins y base hijacking. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://www.datos.gov.co https://secop-backend.onrender.com https://*.vercel.app; object-src 'none'; base-uri 'self'" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
    <title>SECOP Insight — Observatorio</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
