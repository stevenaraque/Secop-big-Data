server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # P0-5: headers anti-XSS para JWT en localStorage. Qué: CSP + frame + type. Por qué: mitiga robo de token.
    # connect-src incluye prod Render. object-src/base-uri cierran plugins y base hijacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 https://www.datos.gov.co https://secop-backend.onrender.com; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache estáticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # en prod el TLS 1.3 lo termina Render/Vercel/Cloudflare con Let's Encrypt
}
